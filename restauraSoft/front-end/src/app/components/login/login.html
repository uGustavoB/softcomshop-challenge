<div class="min-h-screen flex items-center justify-center bg-gradient-to-br
            from-neutral-950 via-neutral-900 to-neutral-950 p-4">

  <div class="w-full max-w-md rounded-xl border border-neutral-800
              bg-neutral-900/50 backdrop-blur-sm shadow-lg">

    <!-- Header -->
    <div class="p-6 text-center space-y-3">
      <div class="flex justify-center">
        <div class="h-16 w-16 rounded-2xl bg-gradient-to-br from-amber-500 to-orange-600
                    flex items-center justify-center">
          <mat-icon class="text-white text-4xl">restaurant</mat-icon>
        </div>
      </div>

      <h1 class="text-3xl font-bold text-white">RestauraSoft</h1>
      <p class="text-neutral-400 text-sm">
        {{ isLoginMode ? 'Faça login para acessar o sistema' : 'Crie sua conta' }}
      </p>
    </div>

    <!-- Form -->
    <div class="p-6 pt-0">
      <form (ngSubmit)="onSubmit()" class="space-y-4">

        <!-- Nome (apenas no registro) -->
        <div *ngIf="!isLoginMode" class="space-y-2">
          <label class="text-neutral-300 text-sm">Nome completo</label>
          <input
            type="text"
            [(ngModel)]="name"
            name="name"
            required
            [disabled]="isLoading"
            placeholder="Seu nome"
            class="w-full h-10 rounded-md bg-neutral-800 border border-neutral-700
                   text-white placeholder:text-neutral-500 px-3 focus:outline-none focus:ring-2 focus:ring-amber-500"
          />
        </div>

        <!-- Email -->
        <div class="space-y-2">
          <label class="text-neutral-300 text-sm">Email</label>
          <input
            type="email"
            [(ngModel)]="email"
            name="email"
            required
            [disabled]="isLoading"
            placeholder="seu@email.com"
            class="w-full h-10 rounded-md bg-neutral-800 border border-neutral-700
                   text-white placeholder:text-neutral-500 px-3 focus:outline-none focus:ring-2 focus:ring-amber-500"
          />
        </div>

        <!-- Password -->
        <div class="space-y-2">
          <label class="text-neutral-300 text-sm">Senha</label>
          <input
            type="password"
            [(ngModel)]="password"
            name="password"
            required
            [disabled]="isLoading"
            [placeholder]="isLoginMode ? '••••••••' : 'Mínimo 6 caracteres'"
            class="w-full h-10 rounded-md bg-neutral-800 border border-neutral-700
                   text-white placeholder:text-neutral-500 px-3 focus:outline-none focus:ring-2 focus:ring-amber-500"
          />
        </div>

        <!-- Confirmar Senha (apenas no registro) -->
        <div *ngIf="!isLoginMode" class="space-y-2">
          <label class="text-neutral-300 text-sm">Confirmar senha</label>
          <input
            type="password"
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            required
            [disabled]="isLoading"
            placeholder="Digite novamente a senha"
            class="w-full h-10 rounded-md bg-neutral-800 border border-neutral-700
                   text-white placeholder:text-neutral-500 px-3 focus:outline-none focus:ring-2 focus:ring-amber-500"
          />
        </div>

        <!-- Error -->
        <div *ngIf="error"
             class="text-sm text-red-400 bg-red-950/50 border border-red-900
                    rounded-lg p-3">
          {{ error }}
        </div>

        <!-- Submit -->
        <button
          type="submit"
          [disabled]="isLoading"
          class="w-full h-10 rounded-md text-white font-medium
                 bg-gradient-to-r from-amber-500 to-orange-600
                 hover:from-amber-600 hover:to-orange-700
                 disabled:opacity-60 flex items-center justify-center
                 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:ring-offset-2 focus:ring-offset-neutral-900">

          <ng-container *ngIf="isLoading; else buttonText">
            <mat-icon class="mr-2 animate-spin text-sm">autorenew</mat-icon>
            {{ isLoginMode ? 'Entrando...' : 'Criando conta...' }}
          </ng-container>

          <ng-template #buttonText>
            {{ isLoginMode ? 'Entrar' : 'Criar conta' }}
          </ng-template>
        </button>

        <!-- Toggle entre login/registro -->
        <div class="text-center pt-4 border-t border-neutral-800">
          <p class="text-neutral-400 text-sm">
            {{ isLoginMode ? 'Não tem uma conta?' : 'Já tem uma conta?' }}
            <button
              type="button"
              (click)="toggleMode()"
              [disabled]="isLoading"
              class="text-amber-400 hover:text-amber-300 font-medium ml-1
                     disabled:opacity-50 focus:outline-none focus:underline"
            >
              {{ isLoginMode ? 'Cadastre-se' : 'Faça login' }}
            </button>
          </p>
        </div>
      </form>
    </div>

    <!-- Footer -->
    <div class="p-6 pt-0">
      <p class="text-center text-xs text-neutral-500">
        © 2025 RestauraSoft. Todos os direitos reservados.
      </p>
    </div>
  </div>
</div>
